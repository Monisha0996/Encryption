<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SecureMessage{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="navbar navbar-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{{ url_for('index') }}"> SecureMessage</a>
    <div class="d-flex gap-2">
      <a class="btn btn-sm btn-outline-light" href="{{ url_for('encrypt') }}">Encrypt</a>
      <a class="btn btn-sm btn-light" href="{{ url_for('decrypt') }}">Decrypt</a>
    </div>
  </div>
</nav>

<main>{% block content %}{% endblock %}</main>

<footer class="text-center text-muted small py-4">
  SecureMessage • Single-token AES-256-GCM
</footer>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
